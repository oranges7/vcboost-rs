[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vcboostrs"
version = "0.1.0"
description = "Rust-accelerated modules for VCboost variant calling pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
]
scripts = { "vcboost-rs" = "vcboostrs.cli:main" }

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "vcboostrs._vcboostrs"
